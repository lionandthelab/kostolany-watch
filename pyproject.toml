[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kostolany"
version = "0.2.0"
description = "Kostolany egg regime detection engine with SOTA evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "hmmlearn>=0.3.2,<0.4",
  "lightgbm>=4.3",
  "yfinance>=0.2.40",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "joblib>=1.3",
  "rich>=13.7",
  "typer>=0.12",
  "pyarrow>=15.0",
  "google-cloud-storage>=2.14",
  "pywebpush>=2.0",
  "py-vapid>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  # Only `scripts/make_favicon.py` needs it; it used to arrive transitively via
  # matplotlib, which is no longer a runtime dep. Dev-only keeps it out of the image.
  "pillow>=10.0",
]
korea = [
  "finance-datareader>=0.9.50",
  "pykrx>=1.0.45",
]

[project.scripts]
kostolany = "kostolany.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kostolany"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
